<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kopi Corner paper trading floor</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem auto; max-width: 960px; padding: 0 1rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .75rem; }
    .card { border: 1px solid #ccc; border-radius: 10px; padding: .75rem; }
    .card h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
    .up { color: #0a7a2f; } .down { color: #b00020; }
    svg { width: 100%; height: 50px; }
    #log { font: 12px/1.4 monospace; max-height: 260px; overflow: auto; background: #f6f6f6; padding: .5rem; }
  </style>
</head>
<body>
  <h1>Paper trading floor</h1>
  <p>Pretend money only (S$10,000 each). The numbers refresh every few seconds.</p>
  <div class="cards" id="cards"></div>
  <h2>Live log</h2>
  <div id="log"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
