# Frontend engineer agent (the UI check): after Vercel finishes a preview deploy, a headless browser uses every page the way a person
# does. It hovers, clicks and Tabs through each interactive element on a desktop and a phone screen and flags
# popups that stay open and overlap, popups off the screen, content wider than the screen, script errors and
# missing files. That part is a plain script, so the pass/fail result is the same every time. Claude then looks
# at screenshots of the pages that changed and notes visual problems a script cannot see (text running into
# text, cut-off words, unreadable colours); those notes never fail the check on their own.
# It posts one comment on the pull request (updated on each run), sets a "UI check" status and tells TX on
# Telegram when something needs a look. It never pushes or edits files.
name: Frontend engineer (UI check)
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      pages:
        description: Pages to test, space separated (empty = all). e.g. ecosystem.html agentic-ai/09-outreach-email-helper.html
        required: false
permissions:
  contents: read
concurrency:
  group: ui-check-${{ github.event.deployment.sha || github.sha }}
  cancel-in-progress: true
env:
  SHA: ${{ github.event.deployment.sha || github.sha }}
  CONTEXT: UI check
jobs:
  # Shows a yellow "UI check" dot on the pull request while the browser runs.
  start:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production')
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Show the agent as working on the How it works page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: run
        run: "[ -f scripts/record-status.mjs ] && node scripts/record-status.mjs ui-check || true"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$CONTEXT" -f description="Clicking through the preview…" -f target_url="$RUN" >/dev/null || true

  # Read-only job: branch code and Claude never share a job with a write token. The share job does the writing.
  check:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.find.outputs.pr }}
      ran: ${{ steps.run.outputs.ran }}
      nopages: ${{ steps.find.outputs.nopages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Find the pull request and the pages that changed
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[]|select(.state=="open")][0].number // empty' 2>/dev/null || true)
          case "$pr" in ''|*[!0-9]*) pr= ;; esac
          if [ -n "$pr" ]; then changed=$(gh pr diff "$pr" -R "$GITHUB_REPOSITORY" --name-only 2>/dev/null || true)
          else changed=$(git diff --name-only "$SHA^1" "$SHA" 2>/dev/null || true); fi
          # Pages Claude looks at: served pages that changed, at most 4.
          shots=$(echo "$changed" | grep -E '\.html$' | grep -vE '^(inbox/|scripts/|\.github/)|_template\.html$' | while read -r f; do [ -f "$f" ] && echo "$f"; done | head -4 | tr '\n' ' ')
          # Pages to test: the served pages that changed (a small sample when shared layout files changed). A manual run with `pages` or empty
          # input on a manual run tests what it is told / everything; a preview of a pull request tests only what changed.
          pages=$(echo "$changed" | grep -E '\.html$' | grep -vE '^(inbox/|scripts/|\.github/)|_template\.html$|^404\.html$' | while read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done)
          if echo "$changed" | grep -qE '^assets/(site|teach)\.(css|js)$|^tracks\.js$'; then
            pages="index.html ecosystem.html glossary.html about.html $(for d in $(ls -d */ | tr -d /); do if [ -f "$d/lessons.js" ]; then echo "$d/index.html"; ls "$d" | grep -E '^[0-9]+.*\.html$' | sort | head -1 | sed "s#^#$d/#"; fi; done)"
          fi
          pages=$(echo $pages | tr ' ' '\n' | sort -u | head -12 | xargs)
          nopages=; [ "${{ github.event_name }}" = deployment_status ] && [ -z "$pages" ] && nopages=1
          echo "pr=$pr shots=$shots pages=$pages nopages=$nopages"
          { echo "pr=$pr"; echo "shots=$shots"; echo "pages=$pages"; echo "nopages=$nopages"; } >> "$GITHUB_OUTPUT"
      - name: Cache the headless browser
        if: steps.find.outputs.nopages != '1'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/pw
          key: pw-1.49.1-${{ runner.os }}
      - name: Install a headless browser
        if: steps.find.outputs.nopages != '1'
        run: |
          [ -x "$RUNNER_TEMP/pw/node_modules/.bin/playwright" ] || npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          # A cache hit already holds the browser; only install it (and its system libraries) when it cannot start.
          node -e "require(process.argv[1]+'/node_modules/playwright').chromium.launch().then(b=>b.close())" "$RUNNER_TEMP/pw" 2>/dev/null \
            && echo "Browser from cache" || "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Hover, click and Tab through the pages that changed (every page on a manual run)
        id: run
        if: steps.find.outputs.nopages != '1'
        timeout-minutes: 20
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
          PAGES: ${{ inputs.pages || (github.event_name == 'deployment_status' && steps.find.outputs.pages) || '' }}
          SHOTS: ${{ steps.find.outputs.shots }}
          # Optional. With Vercel's "Protection Bypass for Automation" secret the check opens the real preview;
          # without it, it serves this commit's files itself (the site is plain static files, so they are the same).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          if [ ! -f scripts/ui-check.mjs ]; then echo "This commit has no scripts/ui-check.mjs yet; nothing to run."; exit 0; fi
          echo "ran=1" >> "$GITHUB_OUTPUT"
          args=(--out /tmp/out)
          [ -n "$PAGES" ] && args+=(--pages "$PAGES")
          [ -n "$SHOTS" ] && args+=(--shots "$SHOTS")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] && [ -n "$PREVIEW" ]; then args+=(--base "$PREVIEW"); fi
          set +e; node scripts/ui-check.mjs "${args[@]}"; code=$?; set -e
          echo "Exit code $code (0 = passed, 1 = problems found, 2 = the check broke)"
          [ "$code" -le 1 ]
      - name: Install Claude Code
        if: steps.find.outputs.shots != '' && steps.run.outputs.ran == '1'
        run: npm install -g @anthropic-ai/claude-code
      - name: Visual pass with Claude
        timeout-minutes: 6
        if: steps.find.outputs.shots != '' && steps.run.outputs.ran == '1'
        continue-on-error: true
        env:
          # Prefer TX's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`); the API key is only a fallback.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; echo "Auth: Claude subscription"; else unset CLAUDE_CODE_OAUTH_TOKEN; echo "Auth: API key (no CLAUDE_CODE_OAUTH_TOKEN secret)"; fi
          ls /tmp/out/shots/*-[0-9].png > /tmp/out/tiles.txt || { echo 'No screenshots to look at.'; exit 0; }
          cat > /tmp/ui-prompt.md <<'PROMPT'
          You are the frontend engineer for TX Learns, a bilingual (EN/中文) learning site. You care that every page
          looks finished and readable on a laptop and a phone. The pages that changed were
          screenshotted once on a 1280px desktop and once on a 390px phone: the top of each page, up to 2000 to 2400 px tall.
          The images are listed in /tmp/out/tiles.txt, named <page>-<desktop|phone>-1.png.
          A script has already hovered, clicked and Tabbed through every page; its findings are in /tmp/out/ui-check.json.
          Do not repeat those.

          Look at every image with the Read tool, once each and report only clear visual bugs a visitor would notice:
          text running into or over other text, words or buttons cut off, boxes spilling out of their container,
          text you cannot read against its background, a widget or diagram that looks broken or empty,
          a phone layout squeezed into unreadable columns, a button too small to tap on the phone, a popup or
          diagram cut off at the edge, two elements stacked on top of each other. Ignore taste, wording, and the decorative glow.
          The 中文 text is hidden on purpose when the page is in English.

          A short subtitle that ends in "…" on purpose is a design choice, not a bug.

          Your final answer must be only one JSON object, nothing before or after it, exactly like:
          {"issues":[{"page":"ecosystem.html","screen":"phone","where":"agent cards","what":"the status pill is cut off at the right edge"}]}
          At most 6 issues, most visible first. Answer {"issues":[]} if you see none.
          PROMPT
          # Claude can only read. Its answer is captured from the output instead of giving it a write tool.
          curl -fsS -o /tmp/claude-run.mjs "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/claude-run.mjs" && CC="node /tmp/claude-run.mjs ui-check" || CC=claude
          $CC --model haiku --exclude-dynamic-system-prompt-sections -p "$(cat /tmp/ui-prompt.md)" --max-turns 14 --add-dir /tmp/out --allowedTools "Read" --output-format text > /tmp/out/visual.txt || true
          tail -20 /tmp/out/visual.txt
          node -e 'const fs=require("fs"),t=fs.readFileSync("/tmp/out/visual.txt","utf8"),v=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));if(!Array.isArray(v.issues))throw new Error("no issues list");fs.writeFileSync("/tmp/out/visual.json",JSON.stringify({issues:v.issues.slice(0,6)}))' \
            && echo "Visual notes saved." || echo "::warning::The visual pass gave no readable result."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.run.outputs.ran == '1'
        with:
          name: ui-check
          path: /tmp/out/
          if-no-files-found: ignore

  # Write job: only trusted scripts from the default branch run here, never files from the branch under test.
  share:
    needs: [start, check]
    if: ${{ !cancelled() && needs.start.result == 'success' && needs.check.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pull-requests: write
      issues: write
      actions: write
    env:
      PR: ${{ needs.check.outputs.pr }}
      RAN: ${{ needs.check.outputs.ran }}
      CHECK: ${{ needs.check.result }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      T: trusted/scripts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: |
            scripts
            banned-words.txt
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.check.outputs.ran == '1'
        continue-on-error: true
        with:
          name: ui-check
          path: /tmp/out
      - name: Record what the agent used (tokens and estimated cost)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "[ -f $T/trace.mjs ] && node $T/trace.mjs push ui-check /tmp/out || true"
      - name: Comment and set the status
        id: share
        run: |
          # A check job that broke before the browser ran must never look like a pass.
          if [ "${{ needs.check.outputs.nopages }}" = 1 ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context="$CONTEXT" -f description="Skipped: no served page changed" -f target_url="$RUN" >/dev/null
            echo "state=skip" >> "$GITHUB_OUTPUT"; echo "No served page changed, so nothing to click through." > /tmp/line.txt; exit 0
          fi
          if [ "$RAN" != 1 ] && [ "$CHECK" != success ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=error -f context="$CONTEXT" -f description="The UI check could not finish. See the logs." -f target_url="$RUN" >/dev/null
            echo "state=fail" >> "$GITHUB_OUTPUT"; echo "The UI check could not finish." > /tmp/line.txt; exit 0
          fi
          if [ "$RAN" != 1 ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context="$CONTEXT" -f description="Skipped: this commit has no UI check script yet" -f target_url="$RUN" >/dev/null
            echo "state=skip" >> "$GITHUB_OUTPUT"; echo "This commit has no UI check script yet." > /tmp/line.txt; exit 0
          fi
          if [ ! -s /tmp/out/ui-check.json ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=error -f context="$CONTEXT" -f description="The UI check could not finish. See the logs." -f target_url="$RUN" >/dev/null
            echo "state=fail" >> "$GITHUB_OUTPUT"; echo "The UI check could not finish." > /tmp/line.txt; exit 0
          fi
          node - <<'JS'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/out/ui-check.json', 'utf8'));
          let v = { issues: [] }; try { v = JSON.parse(fs.readFileSync('/tmp/out/visual.json', 'utf8')); } catch {}
          const vis = (Array.isArray(v.issues) ? v.issues : []).slice(0, 6);
          const cell = s => String(s || '').replace(/[|\n\r]/g, ' ').slice(0, 300);
          let md = '<!-- tx-ui-check -->\n' + fs.readFileSync('/tmp/out/ui-check.md', 'utf8');
          if (vis.length) {
            md += '\n👀 **Visual pass (Claude)** on the pages that changed. These are notes, they do not fail the check:\n\n';
            md += vis.map(i => `- \`${cell(i.page)}\` (${cell(i.screen)}), ${cell(i.where)}: ${cell(i.what)}`).join('\n') + '\n';
          }
          md += `\nScreenshots and logs: [this run](${process.env.RUN}). _Checked by the TX Learns frontend engineer agent._\n`;
          fs.writeFileSync('/tmp/comment.md', md);
          // Visual notes are suggestions: they stay in the PR comment and the summary line but never turn the agent orange,
          // so only a real UI problem shows as "flagged" on the Ecosystem page.
          const state = r.issues ? 'flag' : 'ok';
          const line = r.summary + (vis.length ? ` Claude also noted ${vis.length} visual thing${vis.length > 1 ? 's' : ''} to look at.` : '');
          fs.writeFileSync('/tmp/line.txt', line);
          fs.writeFileSync(process.env.GITHUB_OUTPUT, `state=${state}\nfailed=${r.issues ? 1 : 0}\nvisual=${vis.length}\n`, { flag: 'a' });
          JS
          failed=$(node -e 'console.log(require("/tmp/out/ui-check.json").issues)')
          if [ "$failed" -gt 0 ]; then st=failure; desc="$failed UI problem(s) found. Details in the comment."; else st=success; desc="Hovered, clicked and Tabbed through every page."; fi
          url=
          if [ -n "$PR" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- tx-ui-check -->")) | .id' | tail -1)
            if [ -n "$id" ]; then url=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@/tmp/comment.md --jq .html_url)
            else url=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@/tmp/comment.md --jq .html_url); fi
          elif [ "$failed" -gt 0 ] || { [ -s /tmp/out/visual.json ] && [ "$(node -e 'console.log((require("/tmp/out/visual.json").issues||[]).length)' 2>/dev/null || echo 0)" -gt 0 ]; }; then
            url=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/comments" -F body=@/tmp/comment.md --jq .html_url)
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$st -f context="$CONTEXT" -f description="$desc" -f target_url="${url:-$RUN}" >/dev/null
          echo "url=${url:-$RUN}" >> "$GITHUB_OUTPUT"
      - name: Tell TX on Telegram
        # Only when the check itself broke. A red UI check reaches TX through auto-merge (one "needs you" message);
        # visual notes alone never message TX.
        if: always() && steps.share.outputs.state == 'fail'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ steps.share.outputs.url }}
          STATE: ${{ steps.share.outputs.state }}
        run: |
          if [ "$STATE" = flag ]; then
            { echo "🖱️ UI check on ${PR:+PR #$PR}${PR:-$(echo "$SHA" | cut -c1-7)}: $(cat /tmp/line.txt)"; echo "$URL"; } | node $T/notify-telegram.mjs
          else
            node $T/notify-telegram.mjs "⚠️ The frontend engineer agent could not finish the UI check. Logs: $RUN"
          fi
      - name: Record status for the Ecosystem page
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.share.outputs.state || 'fail' }}
          LINK: ${{ steps.share.outputs.url }}
        run: |
          [ -f $T/record-status.mjs ] || { echo "No record script on the default branch yet."; exit 0; }
          SUMMARY="$(cat /tmp/line.txt 2>/dev/null || echo 'Could not finish.')" node $T/record-status.mjs ui-check
