# Backend engineer agent (the reviewer): Claude reviews the facts and the code (does every code sample run?) of a pull request into main against STYLE.md and CLAUDE.md and posts one comment.
# Every change gets this one review before it can be merged: its verdict is the "Reviewer" status on the exact
# commit it read, and that status is a required check (.github/rulesets/main.json).
#   On a lesson's own pull request (a writer/ branch; started by the reader agent once it is done) it also fixes
#   what it flagged, in lesson files only, as one commit on that pull request, marks that commit too, and tells TX on
#   Telegram that the lesson is ready to approve. One round: if the branch already has a reviewer fix, it only comments.
#   On any other pull request (scripts, workflows, pages) it runs when the PR opens or gets a new commit, and only
#   comments. Telegram for those only on ⚠️ or a failed run.
#   Three things keep it from reading the same change again and again: a draft pull request is not reviewed until it is
#   marked ready; a change that touches no lesson, project package, script (the shared site scripts included), workflow or API function is read by Haiku
#   instead of Sonnet; and after a ✅, later commits are reviewed on their own (only what is new since that ✅).
# Claude runs in a read-only job; a separate job with trusted scripts from main does the writing.
name: Backend engineer (review)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  # Marks the reviewer as working (yellow) on the How it works page while this run goes. Trusted scripts from main only.
  working:
    # A lesson's own pull request (writer/ branch) is reviewed only after the reader, which starts this workflow by hand; opening it must not start a second, earlier review.
    # A draft is still being worked on: it is reviewed once, when it is marked ready (the ready_for_review event).
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'writer/') || github.event.pull_request.draft)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Show the agent as working
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: run
        run: "[ -f scripts/record-status.mjs ] && node scripts/record-status.mjs reviewer || true"
      - name: Start the scope guard (pull requests opened by an agent start no workflow on their own)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: gh workflow run scope-guard.yml --ref main -R "$GITHUB_REPOSITORY" -f pr="$PR" || echo "::warning::Could not start the scope guard."
      - name: Show the Reviewer status as pending on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SHA" ] || SHA=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=Reviewer -f description="Backend engineer agent is reading…" -f target_url="$RUN" > /dev/null || true

  review:
    # A lesson's own pull request (writer/ branch) is reviewed only after the reader, which starts this workflow by hand; opening it must not start a second, earlier review.
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'writer/') || github.event.pull_request.draft)) }}
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.info.outputs.base }}
      head: ${{ steps.info.outputs.head }}
      sha: ${{ steps.info.outputs.sha }}
      fix: ${{ steps.info.outputs.fix }}
      title: ${{ steps.info.outputs.title }}
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: What is being reviewed
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json baseRefName,headRefName,title > /tmp/pr.json
          base=$(node -p 'require("/tmp/pr.json").baseRefName'); head=$(node -p 'require("/tmp/pr.json").headRefName')
          sha=$(git rev-parse HEAD); fix=
          case "$base:$head" in main:writer/*) git log --format=%s "origin/$base..HEAD" | grep -q '^Reviewer:' || fix=1;; esac
          # GitHub refuses the diff of a PR over 300 files; the checkout has the same changes, so diff locally then.
          gh pr diff "$PR" -R "$GITHUB_REPOSITORY" > /tmp/pr.diff 2>/dev/null || git diff "origin/$base...HEAD" > /tmp/pr.diff
          echo "base=$base head=$head sha=$sha fix=$fix"
          { echo "base=$base"; echo "head=$head"; echo "sha=$sha"; echo "fix=$fix"; echo "title=$(node -p 'require("/tmp/pr.json").title.slice(0,100)')"; } >> "$GITHUB_OUTPUT"
      - name: Copy check result for the reviewer
        run: |
          node scripts/check-copy.mjs > /tmp/copy-check.txt 2>&1 || true
          [ -f scripts/check-counts.mjs ] && node scripts/check-counts.mjs >> /tmp/copy-check.txt 2>&1 || true
          [ -f scripts/check-pages.mjs ] && node scripts/check-pages.mjs >> /tmp/copy-check.txt 2>&1 || true
          [ -f scripts/check-security.mjs ] && node scripts/check-security.mjs >> /tmp/copy-check.txt 2>&1 || true
          # Syntax check of every code box in the lessons this PR changes (nothing is run).
          lessons=$(grep -oE '^\+\+\+ b/[^ ]+/[0-9][0-9]-[^ ]+\.html' /tmp/pr.diff | sed 's|^+++ b/||' | tr '\n' ' ')
          if [ -n "$lessons" ] && [ -f scripts/check-code.mjs ]; then node scripts/check-code.mjs $lessons > /tmp/code-check.txt 2>&1 || true; else echo "No lesson code to check." > /tmp/code-check.txt; fi
      - name: Triage without AI (generated files only)
        id: triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A pull request, or the commits since the last review, that changes only generated files (sitemap, hashes, related.json)
          # needs no Sonnet read. The script comes from main, so the branch under review cannot change it; without it the review runs.
          curl -fsS -o /tmp/review-triage.mjs "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/review-triage.mjs" || exit 0
          [ "${{ steps.info.outputs.fix }}" = 1 ] && exit 0
          skip=
          inc=
          if node /tmp/review-triage.mjs /tmp/pr.diff; then skip=1
          else
            # Commits since the last reviewed commit: reuse that verdict when they changed only generated files.
            prev=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body' | grep -o 'tx-review sha=[0-9a-f]*' | tail -1 | cut -d= -f2)
            if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null \
               && [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$prev/status" --jq '[.statuses[]|select(.context=="Reviewer")][0].state' 2>/dev/null)" = success ] \
               && git diff "$prev" HEAD > /tmp/inc.diff; then
              if node /tmp/review-triage.mjs /tmp/inc.diff; then skip=1
              # The rest was read and passed at $prev: review only what is new. Not when main was merged in since (then the
              # increment is larger than the pull request itself) and never on a lesson's own fix round.
              elif [ -s /tmp/inc.diff ] && [ "$(wc -c < /tmp/inc.diff)" -lt "$(wc -c < /tmp/pr.diff)" ]; then cp /tmp/inc.diff /tmp/pr.diff; inc=$prev; fi
            fi
          fi
          echo "inc=$inc" >> "$GITHUB_OUTPUT"
          # Sonnet reads anything a reader could copy and run or that guards the site: lessons, their scripts, project packages,
          # scripts, workflows, the API functions and the shared site scripts. Page, style and wording changes of the site shell go to Haiku.
          if grep -qE '^\+\+\+ b/([^/ ]+/[0-9][0-9]-[^ ]+\.html|[^/ ]+/js/|[^/ ]+/(lessons|prereqs|projects)\.js|packages/|scripts/|\.github/|api/|coach/|schemas/|evals/|assets/[^ ]+\.js|tracks\.js)' /tmp/pr.diff; then echo "model=sonnet" >> "$GITHUB_OUTPUT"; else echo "model=haiku" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$skip" ]; then
            printf '✅ Ready to merge\n\nNo AI review needed: this change touches only generated files (sitemap, ?v= hashes, related.json, page dates), which the page check rebuilds and verifies. The copy, count and page checks still ran.\n' > /tmp/review-comment.md
            echo "✅ Ready to merge: generated files only, no AI review needed." > /tmp/review-summary.txt
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Claude Code
        if: ${{ steps.triage.outputs.skip != '1' }}
        run: npm install -g @anthropic-ai/claude-code
      - name: Review with Claude
        if: ${{ steps.triage.outputs.skip != '1' }}
        env:
          # Prefer TX's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`); the API key is only a fallback.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIX: ${{ steps.info.outputs.fix }}
          STEP: ${{ steps.info.outputs.fix == '1' && 'review-fix' || 'review' }}
          MODEL: ${{ steps.triage.outputs.model || 'sonnet' }}
          INC: ${{ steps.triage.outputs.inc }}
        run: |
          set -o pipefail
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; echo "Auth: Claude subscription"; else unset CLAUDE_CODE_OAUTH_TOKEN; echo "Auth: API key (no CLAUDE_CODE_OAUTH_TOKEN secret)"; fi
          if [ "$FIX" = 1 ]; then
            MODE="This is a lesson's own pull request. After reviewing, fix every finding you can in the lesson files
             (<track>/NN-*.html) only: wording, EN/中文 matching, broken code lines, facts you are sure about.
             Keep TX's voice, the story and the structure. Then run node scripts/check-copy.mjs,
             node scripts/check-counts.mjs and node scripts/check-pages.mjs --fix until all pass. Your verdict describes the lesson AFTER your fixes:
             \"✅ Ready to merge\" when nothing is left for TX, else \"⚠️ Fix before merging\" with only what is left.
             In the comment, list what you fixed under \"Fixed\" and anything left under \"Still for you\"."
          else
            MODE="Only review. Do not edit any file except /tmp/review-comment.md and /tmp/review-summary.txt.
             If the pull request changes no lesson, check what it does change (scripts, workflows, pages, docs) for
             bugs, for CLAUDE.md staying true to the workflows, and for the How it works page staying true to them."
          fi
          # What past reviews keep finding (the authoring memory on the agent-status branch); empty until there is some.
          curl -fsS -o /tmp/memory.json "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/agent-status/memory/authoring.json" || echo "{}" > /tmp/memory.json
          # Deterministic prep before Claude (scripts fetched from main, so the branch under review cannot change them): a short
          # brief with the diff, only the failing checks and the related passages, and a 2 KB rule packet in place of the full docs.
          mkdir -p /tmp/main/scripts/rules
          for f in scripts/agent-context.mjs scripts/max-turns.mjs scripts/rules/reviewer.md; do curl -fsS -o "/tmp/main/$f" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/$f" || true; done
          curl -fsS -o /tmp/runs.json "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/agent-status/trace/runs.json" || true
          if [ -s /tmp/main/scripts/agent-context.mjs ] && [ -s /tmp/main/scripts/rules/reviewer.md ] && node /tmp/main/scripts/agent-context.mjs review --root "$PWD" --diff /tmp/pr.diff --checks /tmp/copy-check.txt --code /tmp/code-check.txt --out /tmp/review-brief.md; then
            { echo; echo "=== RULE PACKET ==="; cat /tmp/main/scripts/rules/reviewer.md; echo; echo "=== BRIEF ==="; cat /tmp/review-brief.md; } > /tmp/review-extra.md
          else
            echo "No brief script on main yet: falling back to the full documents."
            echo "Read CLAUDE.md and STYLE.md first (they are the rules), then /tmp/pr.diff, /tmp/copy-check.txt and /tmp/code-check.txt, and run node scripts/rag.mjs --related <track>/<file> for each changed lesson." > /tmp/review-extra.md
          fi
          TURNS=40; [ -s /tmp/main/scripts/max-turns.mjs ] && TURNS=$(node /tmp/main/scripts/max-turns.mjs reviewer 40 --step "$STEP" --floor 16 || echo 40)
          cat > /tmp/review-prompt.md <<PROMPT
          You are the backend engineer for TX Learns, a bilingual (EN/中文) learning site. Review pull request #$PR.
          Your focus is correctness: every code sample would really run for a reader who copies it, and every fact
          about a tool, library or model is true. Nothing merges without your ✅, and with your ✅ (and green checks)
          it merges by itself, with no person reading it first. Be strict about real errors, relaxed about taste.
          $MODE

          1. Your rules are the rule packet and the brief that follow this prompt. CLAUDE.md and STYLE.md are the full
             reference: open one only for a real question the packet cannot answer, never to read it through.
          2. The brief has the changed files, the diff, the failing checks (if any) and related lessons. Open each changed
             lesson in full. Do not open other files (shared scripts, model lessons, unrelated pages) unless a change clearly affects them.
          2b. /tmp/memory.json is the authoring memory: how often each kind of mistake was found in earlier reviews, with the latest
             example, and decisions to keep. It may be empty. Look for those mistakes first.
          3. The brief's "Check results" are the copyright scrubber, count, page, security and code-box checks, already run
             for this branch. A problem line in it is a blocker (a code box may be a fragment of an earlier step: "..." as an
             elided argument is fine; a real syntax error is a blocker). Do not run those checks again to look, only to confirm your own fixes.
          3b. The brief's related passages are the closest existing lessons (already searched). Use them to catch a lesson that
             contradicts or repeats an existing one, calls the same thing by a different name, or misses a link back to a lesson it builds on.
          4. Check each changed lesson for:
             - Copyright: any platform, program or instructor name, "course"/课程, week/day/"Project N" numbering,
               or examples, prompts and code comments that look copied from a source rather than written in our own words.
             - Succinct and sleek per STYLE.md (key point first, Learn and Show in every step, at least one Test, 3-5 takeaways, no padding, recaps or long story; story optional, 1-3 sentences),
               plain short sentences. Would a newcomer to AI follow it without the source?
             - Correctness, like a backend engineer: would each code box run as shown once the earlier steps are in place?
               Check package names and install lines, imports, function and argument names of the library version used,
               await only inside async code (or at the top of a notebook), return types, model names that exist, and
               that printed output matches what the code does. Facts about tools must be true.
             - Build before use: no step's code calls a function, agent or variable that only a later step creates.
             - The lesson's <meta name="updated"> date is today's date when its text changed (node scripts/check-pages.mjs --fix sets it).
             - EN and 中文 say the same thing; every .en has a .zh.
             - lessons.js lists the lesson with its file; links and the pager work; no broken HTML.
          5. Write ONE comment to /tmp/review-comment.md. Start it with a verdict line:
             "✅ Ready to merge" or "⚠️ Fix before merging". Then a short list of findings, most important first,
             each with file, the exact text and a suggested rewrite. Keep it under 400 words, plain and friendly.
             End with: "_Reviewed by the TX Learns backend engineer agent (Claude)._"
          6. Write a 3 to 5 line plain-text summary to /tmp/review-summary.txt. Its first line must start with the same
             verdict, then the top issues. It is shown publicly: never quote a banned term or source name in it;
             name the file and step instead.
          7. Write /tmp/review.json: the same review as data, exactly this shape and nothing else:
             {"verdict":"ok"|"fix","findings":[{"category":"copyright|code|translation|facts|story|structure|style|other","severity":"blocker|nit","file":"path","text":"one plain sentence, 400 characters at most"}]}
             "ok" only when there is no blocker, "fix" otherwise; a blocker is a real error, a nit is taste. Never quote a banned
             term or source name in it. After the lesson fixes (if you made any) list only what is still wrong.
          Do not run git.
          PROMPT
          cat /tmp/review-extra.md >> /tmp/review-prompt.md
          case "$INC" in ''|*[!0-9a-f]*) ;; *) printf '\nThis is a follow-up review. The pull request passed review at commit %s; the diff you were given holds only what changed since then. Judge that, and say so in your comment.\n' "$INC" >> /tmp/review-prompt.md;; esac
          curl -fsS -o /tmp/claude-run.mjs "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/claude-run.mjs" && CC="node /tmp/claude-run.mjs reviewer" || CC=claude
          TRACE_STEP="$STEP" $CC --model "$MODEL" --exclude-dynamic-system-prompt-sections -p "$(cat /tmp/review-prompt.md)" --max-turns "$TURNS" \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/check-copy.mjs:*),Bash(node scripts/check-counts.mjs:*),Bash(node scripts/check-pages.mjs:*),Bash(node scripts/rag.mjs:*)" \
            --output-format text | tail -30
      - name: Package the result for the share job
        if: always()
        run: |
          mkdir -p /tmp/out
          cp /tmp/review-comment.md /tmp/review-summary.txt /tmp/review.json /tmp/out/ 2>/dev/null || true
          git diff -- '*/[0-9]*.html' > /tmp/out/fix.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: review
          path: /tmp/out/
          if-no-files-found: ignore

  # Write job: only trusted scripts from the default branch run here, never files Claude could have touched.
  # A review cancelled by a newer run of the same PR stays quiet: the newer run reports.
  share:
    needs: [review, working]
    if: ${{ !cancelled() && needs.review.result != 'cancelled' && needs.review.result != 'skipped' && !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'writer/') || github.event.pull_request.draft)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      statuses: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      BASE: ${{ needs.review.outputs.base }}
      HEAD: ${{ needs.review.outputs.head }}
      SHA: ${{ needs.review.outputs.sha }}
      FIX: ${{ needs.review.outputs.fix }}
      TITLE: ${{ needs.review.outputs.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr }}
      T: trusted/scripts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: |
            scripts
            schemas
            banned-words.txt
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.review.outputs.fix == '1'
        with:
          ref: ${{ needs.review.outputs.sha }}
          path: work
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: review
          path: /tmp/out
      - name: Record what the agent used (tokens and estimated cost)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "[ -f $T/trace.mjs ] && node $T/trace.mjs push reviewer /tmp/out || true"
      - name: Comment, and add fixes to the lesson PR
        id: share
        run: |
          test -s /tmp/out/review-comment.md || { echo "The reviewer wrote no comment."; echo "state=fail" >> "$GITHUB_OUTPUT"; exit 1; }
          first=$(grep -m1 . /tmp/out/review-summary.txt 2>/dev/null || grep -m1 . /tmp/out/review-comment.md)
          case "$first" in *⚠️*|*"Fix before"*) state=flag;; *✅*|*"Ready to merge"*) state=ok;; *) state=fail;; esac
          # The structured review (schemas/review.schema.json) is checked by a trusted script. When it is valid, the stricter
          # reading wins: a "fix" in the data blocks a comment that says ✅, and it stands in when the comment has no verdict.
          # What it found is added to the authoring memory, so the writer and the next review see the recurring mistakes.
          if [ -s /tmp/out/review.json ] && node $T/validate.mjs trusted/schemas/review.schema.json /tmp/out/review.json > /dev/null; then
            jv=$(node -p 'require("/tmp/out/review.json").verdict')
            if [ "$jv" = fix ]; then state=flag; elif [ "$state" = fail ]; then state=ok; fi
            GITHUB_TOKEN="$GH_TOKEN" node $T/memory.mjs learn /tmp/out/review.json || true
          else
            echo "::notice::No valid review.json; the verdict comes from the comment."
          fi
          cp /tmp/out/review-comment.md /tmp/c.md
          pushed=
          if [ "$FIX" = 1 ] && [ -s /tmp/out/fix.patch ]; then
            cd work
            git apply --include='*/[0-9]*.html' /tmp/out/fix.patch
            git config user.name "TX Learns backend engineer"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*/[0-9]*.html'
            if ! git diff --cached --quiet; then
              git commit -m "Reviewer: fixes from the review" -m "Made by the backend engineer agent (Claude) on the lesson's own pull request."
              auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
              git -c "http.https://github.com/.extraheader=$auth" push origin "HEAD:refs/heads/$HEAD"
              pushed=$(git rev-parse HEAD)
              { echo; echo "I added these fixes to this pull request as one commit (\"Reviewer: fixes from the review\"). Revert it if you disagree."; } >> /tmp/c.md
              gh workflow run copy-check.yml --ref "$HEAD" -R "$GITHUB_REPOSITORY" || echo "::warning::Could not start the copy check."
            fi
            cd ..
          fi
          # A verdict only counts for the exact commit that was reviewed (plus the reviewer's own fix commit).
          echo "<!-- tx-review sha=$SHA -->" >> /tmp/c.md
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file /tmp/c.md
          # The required "Reviewer" status: green only for ✅, on the reviewed commit and on the fix commit it pushed.
          # The scope guard (scope-guard.yml) says whether the change stays within what was asked. It needs a minute or two;
          # wait for it, and if it found the change goes beyond the request the review cannot be green.
          for i in 1 2 3 4 5 6; do
            sg=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status?per_page=100" --jq '[.statuses[]|select(.context=="Scope guard")][0].state // "none"' 2>/dev/null || echo none)
            [ "$sg" = pending ] || break; sleep 20
          done
          case "$state" in ok) st=success; d="Backend engineer agent: ready to merge";; flag) st=failure; d="Backend engineer agent: fix before merging";; *) st=error; d="Backend engineer agent could not finish";; esac
          if [ "$sg" = failure ]; then st=failure; d="Scope guard: the change goes beyond what was asked"; fi
          for c in "$SHA" $pushed; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$c" -f state=$st -f context=Reviewer -f description="$d" -f target_url="$URL" > /dev/null || echo "::warning::Could not set the Reviewer status on $c"
          done
          summary="PR #$PR: $(head -c 300 /tmp/out/review-summary.txt 2>/dev/null | tr '\n' ' ')"
          { echo "state=$state"; echo "pushed=$pushed"; echo "summary<<EOF"; echo "$summary"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Tell TX on Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE: ${{ steps.share.outputs.state || 'fail' }}
          PUSHED: ${{ steps.share.outputs.pushed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only when the review could not finish. A ✅ merges by itself (it shows in the daily digest); a ⚠️ that the
          # agent could not fix reaches TX through auto-merge's one "needs you" message.
          if [ "$STATE" = fail ]; then
            node $T/notify-telegram.mjs "⚠️ The backend engineer agent could not finish the review on PR #$PR. Logs: $RUN"
          else
            echo "Review is $STATE: no message; auto-merge takes it from here."
          fi
      - name: Record status for the Ecosystem page
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.share.outputs.state || 'fail' }}
          SUMMARY: "${{ steps.share.outputs.summary || format('PR #{0}: could not finish the review.', github.event.pull_request.number || inputs.pr) }}"
          LINK: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr }}
        run: node $T/record-status.mjs reviewer
      - name: Let auto-merge look at it (only when Reviewer and copy-check are both green on this commit)
        # A fix commit the reviewer pushed gets its own copy check, which starts auto-merge by itself.
        if: ${{ !cancelled() && steps.share.outputs.state == 'ok' && steps.share.outputs.pushed == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cc=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --jq '[.check_runs[]|select(.name=="copy-check")]|sort_by(.started_at)|last|.conclusion // "none"' 2>/dev/null || echo none)
          if [ "$cc" = success ]; then gh workflow run auto-merge.yml --ref main -R "$GITHUB_REPOSITORY" || echo "Auto-merge picks it up on its 30-minute run."
          else echo "copy-check is $cc on $SHA: its own run starts auto-merge when it is green."; fi
