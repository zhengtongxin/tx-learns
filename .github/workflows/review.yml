# Reviewer agent: Claude reviews a pull request against STYLE.md and CLAUDE.md and posts one comment.
#   On a lesson's own pull request (a writer/ branch into test; started by the reader agent once it is done) it also
#   fixes what it flagged, in lesson files only, as one commit on that pull request, then tells TX on Telegram that
#   the lesson is ready to approve. One round: if the branch already has a reviewer fix, it only comments.
#   On a release (a pull request into main) it only comments. Its verdict for the exact commit is one of the gates
#   the release agent checks before releasing. Telegram only when the release needs TX (⚠️) or the run failed.
# Claude runs in a read-only job; a separate job with trusted scripts from main does the writing.
name: Claude review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.info.outputs.base }}
      head: ${{ steps.info.outputs.head }}
      sha: ${{ steps.info.outputs.sha }}
      fix: ${{ steps.info.outputs.fix }}
      title: ${{ steps.info.outputs.title }}
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What is being reviewed
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json baseRefName,headRefName,title > /tmp/pr.json
          base=$(node -p 'require("/tmp/pr.json").baseRefName'); head=$(node -p 'require("/tmp/pr.json").headRefName')
          sha=$(git rev-parse HEAD); fix=
          case "$base:$head" in test:writer/*) git log --format=%s "origin/$base..HEAD" | grep -q '^Reviewer:' || fix=1;; esac
          gh pr diff "$PR" -R "$GITHUB_REPOSITORY" > /tmp/pr.diff
          echo "base=$base head=$head sha=$sha fix=$fix"
          { echo "base=$base"; echo "head=$head"; echo "sha=$sha"; echo "fix=$fix"; echo "title=$(node -p 'require("/tmp/pr.json").title.slice(0,100)')"; } >> "$GITHUB_OUTPUT"
      - name: Copy check result for the reviewer
        run: |
          node scripts/check-copy.mjs > /tmp/copy-check.txt 2>&1 || true
          [ -f scripts/check-counts.mjs ] && node scripts/check-counts.mjs >> /tmp/copy-check.txt 2>&1 || true
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Review with Claude
        env:
          # Prefer TX's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`); the API key is only a fallback.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIX: ${{ steps.info.outputs.fix }}
        run: |
          set -o pipefail
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; echo "Auth: Claude subscription"; else unset CLAUDE_CODE_OAUTH_TOKEN; echo "Auth: API key (no CLAUDE_CODE_OAUTH_TOKEN secret)"; fi
          if [ "$FIX" = 1 ]; then
            MODE="This is a lesson's own pull request. After reviewing, fix every finding you can in the lesson files
             (agentic-ai/NN-*.html) only: wording, EN/中文 matching, broken code lines, facts you are sure about.
             Keep TX's voice, the story and the structure. Then run node scripts/check-copy.mjs and
             node scripts/check-counts.mjs until both pass. Your verdict describes the lesson AFTER your fixes:
             "✅ Ready to merge" when nothing is left for TX, else "⚠️ Fix before merging" with only what is left.
             In the comment, list what you fixed under "Fixed" and anything left under "Still for you"."
          else
            MODE="Only review. Do not edit any file except /tmp/review-comment.md and /tmp/review-summary.txt."
          fi
          cat > /tmp/review-prompt.md <<PROMPT
          You are the reviewer for TX Learns, a bilingual (EN/中文) learning site. Review pull request #$PR.
          $MODE

          1. Read CLAUDE.md and STYLE.md first. They are the rules.
          2. Read the diff in /tmp/pr.diff and open each changed lesson in full.
          3. Read /tmp/copy-check.txt (the copyright scrubber's and the count check's output for this branch).
             Any ✗ in it is a blocker.
          4. Check each changed lesson for:
             - Copyright: any platform, program or instructor name, "course"/课程, week/day/"Project N" numbering,
               or examples, prompts and code comments that look copied from a source rather than written in our own words.
             - Human touch per STYLE.md: one running story, Learn / Show / Test in every step, plain short sentences,
               an analogy where it helps, takeaways. Would a newcomer to AI follow it without the source?
             - Correctness: code that would actually run (package names, imports, await placement), facts about tools.
             - EN and 中文 say the same thing; every .en has a .zh.
             - lessons.js lists the lesson with its file; links and the pager work; no broken HTML.
          5. Write ONE comment to /tmp/review-comment.md. Start it with a verdict line:
             "✅ Ready to merge" or "⚠️ Fix before merging". Then a short list of findings, most important first,
             each with file, the exact text and a suggested rewrite. Keep it under 400 words, plain and friendly.
             End with: "_Reviewed by the TX Learns reviewer agent (Claude)._"
          6. Write a 3 to 5 line plain-text summary to /tmp/review-summary.txt. Its first line must start with the same
             verdict, then the top issues. It is shown publicly: never quote a banned term or source name in it;
             name the file and step instead.
          Do not run git.
          PROMPT
          claude -p "$(cat /tmp/review-prompt.md)" --max-turns 40 \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/check-copy.mjs:*),Bash(node scripts/check-counts.mjs:*)" \
            --output-format text | tail -30
      - name: Package the result for the share job
        if: always()
        run: |
          mkdir -p /tmp/out
          cp /tmp/review-comment.md /tmp/review-summary.txt /tmp/out/ 2>/dev/null || true
          git diff -- 'agentic-ai/*.html' > /tmp/out/fix.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review
          path: /tmp/out/
          if-no-files-found: ignore

  # Write job: only trusted scripts from the default branch run here, never files Claude could have touched.
  share:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      BASE: ${{ needs.review.outputs.base }}
      HEAD: ${{ needs.review.outputs.head }}
      SHA: ${{ needs.review.outputs.sha }}
      FIX: ${{ needs.review.outputs.fix }}
      TITLE: ${{ needs.review.outputs.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr }}
      T: trusted/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: |
            scripts
            banned-words.txt
          persist-credentials: false
      - uses: actions/checkout@v4
        if: needs.review.outputs.fix == '1'
        with:
          ref: ${{ needs.review.outputs.sha }}
          path: work
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: review
          path: /tmp/out
      - name: Comment, and add fixes to the lesson PR
        id: share
        run: |
          test -s /tmp/out/review-comment.md || { echo "The reviewer wrote no comment."; echo "state=fail" >> "$GITHUB_OUTPUT"; exit 1; }
          first=$(grep -m1 . /tmp/out/review-summary.txt 2>/dev/null || grep -m1 . /tmp/out/review-comment.md)
          case "$first" in *⚠️*|*"Fix before"*) state=flag;; *✅*|*"Ready to merge"*) state=ok;; *) state=fail;; esac
          cp /tmp/out/review-comment.md /tmp/c.md
          pushed=
          if [ "$FIX" = 1 ] && [ -s /tmp/out/fix.patch ]; then
            cd work
            git apply --include='agentic-ai/*.html' /tmp/out/fix.patch
            git config user.name "TX Learns reviewer"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'agentic-ai/*.html'
            if ! git diff --cached --quiet; then
              git commit -m "Reviewer: fixes from the review" -m "Made by the reviewer agent (Claude) on the lesson's own pull request."
              auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
              git -c "http.https://github.com/.extraheader=$auth" push origin "HEAD:refs/heads/$HEAD"
              pushed=1
              { echo; echo "I added these fixes to this pull request as one commit (\"Reviewer: fixes from the review\"). Revert it if you disagree."; } >> /tmp/c.md
              gh workflow run copy-check.yml --ref "$HEAD" -R "$GITHUB_REPOSITORY" || echo "::warning::Could not start the copy check."
            fi
            cd ..
          fi
          # The release agent reads this marker: a verdict only counts for the exact commit that was reviewed.
          echo "<!-- tx-review sha=$SHA -->" >> /tmp/c.md
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file /tmp/c.md
          summary="PR #$PR: $(head -c 300 /tmp/out/review-summary.txt 2>/dev/null | tr '\n' ' ')"
          { echo "state=$state"; echo "pushed=$pushed"; echo "summary<<EOF"; echo "$summary"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Tell TX on Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE: ${{ steps.share.outputs.state || 'fail' }}
          PUSHED: ${{ steps.share.outputs.pushed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATE" = fail ]; then
            node $T/notify-telegram.mjs "⚠️ The reviewer agent could not finish on PR #$PR. Logs: $RUN"
          elif [ "$BASE" = test ]; then
            # The one message per lesson: read, reviewed and fixed, waiting for TX to approve.
            reader=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body|select(startswith("📖 Reader check"))]|last // ""' | grep -oE '[0-9]+/10' | head -3 | tr '\n' ' ')
            { if [ "$STATE" = ok ]; then echo "✅ Lesson ready for you to approve: $TITLE"; else echo "⚠️ Lesson needs you before it can go in: $TITLE"; fi
              echo "$URL"; echo
              [ -n "$reader" ] && echo "Reader agent: $reader"
              [ -n "$PUSHED" ] && echo "The reviewer agent added its fixes to the PR."
              echo; head -c 1200 /tmp/out/review-summary.txt 2>/dev/null
              echo; echo "Merge it into test and it goes live with tonight's release."; } | node $T/notify-telegram.mjs
          elif [ "$STATE" = flag ]; then
            { echo "⚠️ The reviewer agent wants changes before the release goes live"; echo "$URL"; echo; head -c 1500 /tmp/out/review-summary.txt; } | node $T/notify-telegram.mjs
          else
            echo "Release review is ✅: no message, it shows in the daily digest."
          fi
      - name: Record status for the Ecosystem page
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.share.outputs.state || 'fail' }}
          SUMMARY: "${{ steps.share.outputs.summary || format('PR #{0}: could not finish the review.', github.event.pull_request.number || inputs.pr) }}"
          LINK: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr }}
        run: node $T/record-status.mjs reviewer
