# Release agent: test goes to main as soon as everything is green, checked every hour. TX approves lessons, not releases.
#   Every hour (:00): open or update the release PR test → main, start the copy check (and the reviewer agent for
#        changes never reviewed), and merge it if every gate passes (see scripts/release.mjs). A new commit waits
#        an hour before it can go out, so TX always has time to add "hold". While checks run it waits quietly;
#        a held release gets one Telegram message per new reason.
#   After a real release: the live check agent runs right away (it waits for Vercel to finish deploying first).
#   8 PM Malaysia time (12:00 UTC): the one daily Telegram digest (what went live, what ran, what waits for TX).
# TX can stop a release by adding the label "hold" to the release PR.
# No AI here, and only trusted scripts from main run (scheduled runs always use the default branch).
name: Release
on:
  schedule:
    - cron: '0 * * * *'
    # 8 PM Malaysia time: the daily digest, as its own run (it queues behind that hour's release run).
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      step:
        description: run (release now if green) or digest (send the daily digest now)
        required: true
        default: run
        type: choice
        options: [run, digest]
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read
  deployments: read
concurrency:
  # Runs queue, never overlap, and never cancel each other.
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.run.outputs.released }}
      sha: ${{ steps.run.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          sparse-checkout: |
            scripts
            banned-words.txt
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the release agent
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEP: ${{ inputs.step || (github.event.schedule == '0 12 * * *' && 'digest' || 'run') }}
        run: |
          echo "Step: $STEP"
          if [ "$STEP" = digest ]; then node scripts/release.mjs digest --status; else node scripts/release.mjs run; fi
      - name: Record status for the Ecosystem page
        # Quiet hours (nothing to release, or checks still running) are not recorded, so the page and the digest
        # show what the release agent did, not every hourly look. A cancelled run records nothing.
        if: ${{ !cancelled() && steps.run.outputs.state != 'skip' && steps.run.outputs.state != 'wait' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.run.outputs.state || 'fail' }}
          SUMMARY: ${{ steps.run.outputs.summary || 'The release agent could not finish.' }}
          LINK: ${{ steps.run.outputs.link }}
        run: node scripts/record-status.mjs release
  # Chained: the live check agent runs only after a real release, never on a timer.
  live-check:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    uses: ./.github/workflows/live-check.yml
    with:
      sha: ${{ needs.release.outputs.sha }}
    secrets: inherit
