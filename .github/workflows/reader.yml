# Intern agent (the reader): an intern who is learning AI. After Vercel finishes a preview deploy, Claude reads the lessons that changed as a newcomer
# to AI would, scores how clear each one is and flags the confusing parts.
# On a lesson's own pull request (a writer/ branch into main) it adds its fixes to that pull request as one
# commit when a lesson scores under 8/10, comments with the scores, and then asks the reviewer agent to review.
# Anywhere else it only comments. It never opens a separate fix PR and never pushes to main.
# One round of fixes: it skips its own and the reviewer's fix commits, and fixes a branch at most once.
name: Intern (reader)
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      files:
        description: Lessons to read, space separated, e.g. agentic-ai/08-agents-tools-handoffs.html
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: reader-${{ github.event.deployment.sha || github.sha }}
  cancel-in-progress: false
jobs:
  # Marks the reader as working (yellow) on the How it works page while this run goes. Trusted scripts from main only.
  working:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment != 'Production')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Show the agent as working
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: run
        run: "[ -f scripts/record-status.mjs ] && node scripts/record-status.mjs reader || true"

  read:
    # Only finished preview deploys. Production is skipped: the same lessons were already read on their PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment != 'Production')
    runs-on: ubuntu-latest
    # Read-only job: Claude never shares a job with a write token. The share job below does the writing.
    outputs:
      files: ${{ steps.find.outputs.files }}
      pr: ${{ steps.find.outputs.pr }}
      head: ${{ steps.find.outputs.head }}
      fix: ${{ steps.find.outputs.fix }}
    env:
      SHA: ${{ github.event.deployment.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Find the lessons that changed in this deploy
        id: find
        env:
          FILES: ${{ inputs.files }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=; head=; fix=
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[]|select(.state=="open" and .base.ref=="main")][0].number // empty' 2>/dev/null || true)
          case "$pr" in ''|*[!0-9]*) pr= ;; esac
          if [ -n "$pr" ]; then
            head=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
            # Fixes go onto the lesson's own PR, once: only a writer branch, and only if no reader fix is on it yet.
            case "$head" in writer/*) git log --format=%s "origin/main..$SHA" | grep -q '^Reader:' || fix=1;; esac
          fi
          msg=$(git log -1 --format=%s "$SHA")
          if [ -n "$FILES" ]; then files="$FILES"
          elif echo "$msg" | grep -qE '^(Reader|Reviewer):'; then echo "This deploy is an agent's own fix; not reading it again."; files=
          elif echo "$msg" | grep -qE '^Merge pull request #[0-9]+ from [^ ]+/(writer|reader)/'; then echo "This lesson was already read on its own pull request."; files=
          elif echo "$msg" | grep -qE "^Merge (remote-tracking )?branch '(origin/)?main'"; then echo "This deploy only brings main up to date; those lessons were read on their own pull requests."; files=
          else files=$(git diff --name-only --diff-filter=AM "$SHA^1" "$SHA" -- '*/[0-9]*.html' | tr '\n' ' '); fi
          # Cap one run at 6 lessons: a sweep that touches every lesson (a theme or wording change) must not make Claude read them all.
          files=$(echo $files | tr ' ' '\n' | head -6 | tr '\n' ' ')
          files=$(echo $files)
          echo "pr=$pr head=$head fix=$fix files=$files"
          { echo "pr=$pr"; echo "head=$head"; echo "fix=$fix"; echo "files=$files"; } >> "$GITHUB_OUTPUT"
      - name: Install Claude Code
        if: steps.find.outputs.files != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Read the lessons with Claude
        if: steps.find.outputs.files != ''
        env:
          # Prefer TX's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`); the API key is only a fallback.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FILES: ${{ steps.find.outputs.files }}
          FIX: ${{ steps.find.outputs.fix }}
        run: |
          set -o pipefail
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; echo "Auth: Claude subscription"; else unset CLAUDE_CODE_OAUTH_TOKEN; echo "Auth: API key (no CLAUDE_CODE_OAUTH_TOKEN secret)"; fi
          if [ "$FIX" = 1 ]; then
            EDIT="7. Then, only for a lesson you scored under 8, fix what you flagged, in the lesson files only: small wording changes, a missing step or
             definition, a clearer analogy. Keep TX's voice, the story and the structure. Change EN and 中文 together.
             Do not touch anything you scored as fine. Run node scripts/check-copy.mjs,
             node scripts/check-counts.mjs and node scripts/check-pages.mjs --fix until all pass."
          else
            EDIT="7. Do not edit any file except /tmp/reader.json and /tmp/reader-comment.md."
          fi
          # Who each lesson is for (level and what it assumes), worked out without AI by a trusted script from main.
          BRIEF=$(curl -fsS "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/reader-brief.mjs" -o /tmp/reader-brief.mjs && node /tmp/reader-brief.mjs $FILES || true)
          [ -n "$BRIEF" ] || BRIEF="- every lesson: read it as a complete newcomer to AI who can read a little Python."
          cat > /tmp/reader-prompt.md <<PROMPT
          You are the intern at TX Learns, a bilingual (EN/中文) interactive learning site about AI. You are learning AI
          yourself: smart and curious, and you have never seen the source material. A new version was just deployed.
          Read these lessons to learn from them, and be honest about every place you got lost, the way you would tell
          your mentor. Lessons: $FILES

          Who each lesson is for (read and score each lesson as THAT reader, not as a beginner every time):
          $BRIEF
          What that reader already knows is not a gap. Still flag anything this lesson itself brings in without
          explaining it: a library, a service, a term, a step, a name in a code box.

          1. Read STYLE.md so you know what a good lesson here looks like.
          2. Read each lesson top to bottom in English, then skim the 中文. Look at assets/teach.js only if you need
             to know what a widget does. Imagine clicking every quiz and widget.
          3. Note every place you would get stuck: a term used before it is explained, a jump in steps, code you
             could not follow, a quiz whose answer was never taught, an analogy that does not fit, 中文 that reads
             like a word-for-word translation. Also note the one question you would still ask your mentor.
          4. Score each lesson for clarity from 1 to 10, for the reader it is for: 8 or more = that reader gets it on
             the first read and could do the steps; 6 or 7 = gets the idea but is stuck in one or two places;
             5 or less = could not follow a whole step. A long list of small points alone does not make a low score.
          5. Write /tmp/reader.json exactly like:
             {"lessons":[{"file":"...","score":8,"confusing":[{"where":"Step 2","quote":"exact text","why":"...","fix":"..."}]}],
              "summary":"one plain sentence about what a newcomer would struggle with most"}
             At most 5 items per lesson, most important first. An empty list is fine.
             The summary is shown publicly: never quote a banned term or source name in it.
          6. Write /tmp/reader-comment.md: start with "📖 Reader check", then for each lesson its score and the
             confusing parts as a short list (where, quote, why, suggested fix). Under 350 words, friendly and plain.
             End with "_Read by the TX Learns intern agent (Claude), who is learning AI too._"
          $EDIT
          Do not run git.
          PROMPT
          curl -fsS -o /tmp/runs.json "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/agent-status/trace/runs.json" || true
          curl -fsS -o /tmp/max-turns.mjs "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/max-turns.mjs" && TURNS=$(node /tmp/max-turns.mjs reader 50 --floor 20 || echo 50) || TURNS=50
          curl -fsS -o /tmp/claude-run.mjs "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/claude-run.mjs" && CC="node /tmp/claude-run.mjs reader" || CC=claude
          $CC --model haiku --exclude-dynamic-system-prompt-sections -p "$(cat /tmp/reader-prompt.md)" --max-turns "$TURNS" \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/check-copy.mjs:*),Bash(node scripts/check-counts.mjs:*),Bash(node scripts/check-pages.mjs:*)" \
            --output-format text | tail -30
      - name: Package the result for the share job
        if: always() && steps.find.outputs.files != ''
        run: |
          mkdir -p /tmp/out
          cp /tmp/reader.json /tmp/reader-comment.md /tmp/out/ 2>/dev/null || true
          git diff -- '*/[0-9]*.html' > /tmp/out/fix.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.find.outputs.files != ''
        with:
          name: reader
          path: /tmp/out/
          if-no-files-found: ignore

  # Write job: only trusted scripts from the default branch run here, never files Claude could have touched.
  share:
    needs: [read, working]
    if: ${{ !cancelled() && needs.read.result != 'cancelled' && needs.read.result != 'skipped' && needs.read.outputs.files != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      SHA: ${{ github.event.deployment.sha || github.sha }}
      PR: ${{ needs.read.outputs.pr }}
      HEAD: ${{ needs.read.outputs.head }}
      FIX: ${{ needs.read.outputs.fix }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      T: trusted/scripts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: |
            scripts
            banned-words.txt
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          path: work
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: reader
          path: /tmp/out
      - name: Record what the agent used (tokens and estimated cost)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "[ -f $T/trace.mjs ] && node $T/trace.mjs push reader /tmp/out || true"
      - name: Keep the scores for the improvement agent (latest score per lesson)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "[ -s /tmp/out/reader.json ] && [ -f $T/signals.mjs ] && node $T/signals.mjs record-reader /tmp/out/reader.json || true"
      - name: Share the result
        id: share
        run: |
          test -s /tmp/out/reader.json || { echo "The reader wrote no result."; exit 1; }
          low=$(node -e 'const r=require("/tmp/out/reader.json");console.log(Math.floor(Math.min(10,...r.lessons.map(l=>+l.score||0))))')
          node -e 'const r=require("/tmp/out/reader.json");console.log(r.lessons.map(l=>String(l.file).split("/").pop()+" "+l.score+"/10").join(", ")+". "+(r.summary||""))' > /tmp/reader-line.txt
          echo "low=$low" >> "$GITHUB_OUTPUT"
          url=; pushed=
          cp /tmp/out/reader-comment.md /tmp/c.md
          if [ "$FIX" = 1 ] && [ -s /tmp/out/fix.patch ] && [ "$low" -lt 8 ]; then
            # The fix lands on the lesson's own pull request, so TX still merges once per lesson.
            cd work
            git apply --include='*/[0-9]*.html' /tmp/out/fix.patch
            git config user.name "TX Learns intern"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*/[0-9]*.html'
            git commit -m "Reader: clearer wording for newcomers" -m "Suggested by the intern agent (Claude) after reading the preview."
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=$auth" push origin "HEAD:refs/heads/$HEAD"
            cd ..
            pushed=1
            { echo; echo "I added these fixes to this pull request as one commit (\"Reader: clearer wording for newcomers\"). Revert it if you disagree."; } >> /tmp/c.md
            # The workflow token's push starts no workflows: start the required copy check on the branch.
            gh workflow run copy-check.yml --ref "$HEAD" -R "$GITHUB_REPOSITORY" || echo "::warning::Could not start the copy check."
          fi
          if [ -n "$PR" ]; then
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file /tmp/c.md
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR"
          else
            url=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/comments" -F body=@/tmp/c.md --jq .html_url)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"
      - name: Ask the backend engineer agent to review the lesson pull request
        # After the reader (with or without fixes), so the reviewer sees the final wording. Runs even if the reader failed.
        if: always() && startsWith(needs.read.outputs.head, 'writer/') && needs.read.outputs.pr != ''
        run: gh workflow run review.yml -R "$GITHUB_REPOSITORY" -f pr="$PR" || echo "::warning::Could not start the backend engineer agent."
      - name: Tell TX on Telegram
        # Quiet when it works: scores go into the daily digest, and the reviewer agent pings when the lesson is ready.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node $T/notify-telegram.mjs "⚠️ The intern agent could not finish${PR:+ on PR #$PR}. Logs: $RUN"
      - name: Record status for the Ecosystem page
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOW: ${{ steps.share.outputs.low }}
          LINK: ${{ steps.share.outputs.url }}
          PUSHED: ${{ steps.share.outputs.pushed }}
        run: |
          [ -f $T/record-status.mjs ] || { echo "No record script on the default branch yet."; exit 0; }
          if [ -z "$LOW" ]; then STATE=fail; SUMMARY="Could not finish reading."
          elif [ "$LOW" -ge 8 ]; then STATE=ok; SUMMARY="$(cat /tmp/reader-line.txt)"
          else STATE=flag; SUMMARY="$(cat /tmp/reader-line.txt)${PUSHED:+ Fixes added to the lesson PR.}"; fi
          STATE=$STATE SUMMARY="$SUMMARY" node $T/record-status.mjs reader

  # Nothing to read on this deploy (no changed lessons): clear the working mark, record nothing else.
  idle:
    needs: [read, working]
    if: ${{ !cancelled() && needs.read.result != 'cancelled' && needs.read.result != 'skipped' && needs.read.outputs.files == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ needs.read.result == 'success' && 'idle' || 'fail' }}
          SUMMARY: Could not finish reading.
        run: "[ -f scripts/record-status.mjs ] && node scripts/record-status.mjs reader || true"
