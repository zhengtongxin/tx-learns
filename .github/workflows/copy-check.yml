# Cybersecurity engineer agent (the copy check): blocks a pull request that leaks a secret, adds an unsafe link or an unsafe
# workflow line (scripts/check-security.mjs), and the copyright scrubber blocks a pull request into main when a page names a source, a course, an instructor or a
# source's week/day structure, or when a stray build file (.pyc, __pycache__, .DS_Store, node_modules) is committed.
# It also runs the count check: topic and lesson counts, the lesson list and lesson tags must agree with lessons.js.
# Agents that open or push to a pull request with the workflow token start it by hand (workflow_dispatch on that
# branch), because such pushes do not start workflows on their own. Its job name "copy-check" is a required check
# in .github/rulesets/.
name: Cybersecurity engineer (copy check)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Marks the copy-check as working (yellow) on the How it works page while this run goes. Trusted scripts from main only.
  working:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Show the agent as working
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: run
        run: "[ -f scripts/record-status.mjs ] && node scripts/record-status.mjs copy-check || true"

  copy-check:
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.result.outputs.line }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Scan served files
        run: node scripts/check-copy.mjs | tee copy-check.txt; exit ${PIPESTATUS[0]}
      - name: Check lesson counts and tags
        if: success() || failure()
        run: "[ -f scripts/check-counts.mjs ] || { echo 'No count check on this branch yet.' > counts.txt; exit 0; }; node scripts/check-counts.mjs | tee counts.txt; exit ${PIPESTATUS[0]}"
      - name: Security check (secrets, unsafe links, unsafe workflow lines)
        if: success() || failure()
        run: "[ -f scripts/check-security.mjs ] || { echo 'No security check on this branch yet.' > security.txt; exit 0; }; node scripts/check-security.mjs | tee security.txt; exit ${PIPESTATUS[0]}"
      - name: Check pages (lang, title, previews, alt text, headings, EN/中文 twins)
        if: success() || failure()
        run: "[ -f scripts/check-pages.mjs ] || { echo 'No page check on this branch yet.' > pages.txt; exit 0; }; node scripts/check-pages.mjs | tee pages.txt; exit ${PIPESTATUS[0]}"
      - name: Cache the headless browser
        if: (success() || failure()) && github.event_name == 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/pw
          key: pw-1.49.1-${{ runner.os }}
      - name: Phone fit (changed pages only; content wider than a 390px phone or a popup off the side blocks the merge)
        if: (success() || failure()) && github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin main >/dev/null 2>&1 || true
          changed=$(git diff --name-only origin/main HEAD 2>/dev/null || true)
          pages=$(echo "$changed" | grep -E '\.html$' | grep -vE '^(inbox/|scripts/|\.github/)|_template\.html$|^404\.html$' | while read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done)
          # Shared layout files change every page: test a small sample (home, How it works, glossary, each track's page and first lesson) instead of all of them.
          if echo "$changed" | grep -qE '^assets/(site|teach)\.(css|js)$|^tracks\.js$'; then
            pages="index.html ecosystem.html glossary.html about.html $(for d in $(ls -d */ | tr -d /); do if [ -f "$d/lessons.js" ]; then echo "$d/index.html"; ls "$d" | grep -E '^[0-9]+.*\.html$' | sort | head -1 | sed "s#^#$d/#"; fi; done)"
          fi
          pages=$(echo $pages | tr ' ' '\n' | sort -u | head -12 | xargs)
          if [ -z "$pages" ]; then echo "No served page changed: nothing to fit-check." | tee fit.txt; exit 0; fi
          { { [ -x "$RUNNER_TEMP/pw/node_modules/.bin/playwright" ] || npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1 >/dev/null; } \
            && { node -e "require(process.argv[1]+'/node_modules/playwright').chromium.launch().then(b=>b.close())" "$RUNNER_TEMP/pw" 2>/dev/null || "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null; }; } \
            || { echo "::notice::The browser could not be installed, so the phone fit was skipped on this run."; exit 0; }
          PLAYWRIGHT_DIR="$RUNNER_TEMP/pw" node scripts/ui-check.mjs --fit --out "$RUNNER_TEMP/fit" --pages "$pages" | tee fit.txt; exit ${PIPESTATUS[0]}
      - name: Shared script tests (only when assets/site.js changed)
        if: (success() || failure()) && github.event_name == 'pull_request'
        run: |
          [ -f scripts/test-site.mjs ] || exit 0
          git diff --name-only origin/main HEAD 2>/dev/null | grep -qE '^assets/site\.js$|^scripts/test-site\.mjs$' || { echo "The shared site script did not change."; exit 0; }
          [ -x "$RUNNER_TEMP/pw/node_modules/.bin/playwright" ] || { echo "::notice::No browser on this run, so the shared script tests were skipped."; exit 0; }
          PLAYWRIGHT_DIR="$RUNNER_TEMP/pw" node scripts/test-site.mjs | tee site-tests.txt; code=${PIPESTATUS[0]}
          # 2 means the tests could not start (no browser): a notice, not a failed check.
          if [ "$code" = 2 ]; then echo "::notice::The shared script tests could not start on this run."; exit 0; fi
          exit "$code"
      - name: Tell TX on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHERE: ${{ github.event.pull_request.html_url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
        run: |
          { echo "🛡️ Cybersecurity engineer agent: the copy and security check failed on ${GITHUB_REF_NAME}"; echo "$WHERE"; echo; cat copy-check.txt security.txt counts.txt pages.txt fit.txt site-tests.txt 2>/dev/null | head -c 3000; } \
            | node scripts/notify-telegram.mjs
      - name: Pass the result to the status job
        id: result
        if: always()
        run: echo "line=$(tail -1 copy-check.txt 2>/dev/null) $(tail -1 counts.txt 2>/dev/null) $(tail -1 pages.txt 2>/dev/null)" >> "$GITHUB_OUTPUT"
  # Separate job: the write token never runs alongside branch code.
  record:
    needs: [copy-check, working]
    # A cancelled run records nothing; a newer run reports.
    if: ${{ !cancelled() && needs.copy-check.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Record status for the Ecosystem page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ needs.copy-check.result == 'success' && 'ok' || 'flag' }}
          SUMMARY: "On ${{ github.head_ref || github.ref_name }}: ${{ needs.copy-check.outputs.line }}"
          LINK: ${{ github.event.pull_request.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: "[ -f scripts/record-status.mjs ] && node scripts/record-status.mjs copy-check || echo \"No record script on the default branch yet.\""
      - name: Let auto-merge look at it (only when copy-check and Reviewer are both green on this commit)
        if: ${{ !cancelled() && needs.copy-check.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rev=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status?per_page=100" --jq '[.statuses[]|select(.context=="Reviewer")][0].state // "none"' 2>/dev/null || echo none)
          if [ "$rev" = success ]; then gh workflow run auto-merge.yml --ref main -R "$GITHUB_REPOSITORY" || echo "Auto-merge picks it up on its 30-minute run."
          else echo "Reviewer is $rev on $SHA: the review starts auto-merge when it is green. A red check is reported by auto-merge's 30-minute run."; fi
