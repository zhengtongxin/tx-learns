# Content creator agent (the writer): when raw notes land in inbox/<concept>/ on the notes branch, Claude writes a lesson draft to
# STYLE.md and opens a pull request into main. It never pushes to main itself.
# The notes branch is data only (never deployed, never merged). A push there only hands the folders over to this
# workflow as it is on main (workflow_dispatch on main), so the writer always runs main's trusted version.
# That pull request is the only one for the lesson: the reader and reviewer agents add their fixes to it as
# commits, and the reviewer agent tells TX on Telegram when it is ready to approve. TX merges once.
name: Content creator (writer)
on:
  push:
    branches: [notes]
    paths:
      - 'inbox/**'
      - '!inbox/README.md'
  workflow_dispatch:
    inputs:
      folder:
        description: Inbox folders on the notes branch to write up, space separated, e.g. inbox/agents-as-tools
        required: true
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: writer-${{ github.event_name }}-${{ inputs.folder || github.run_id }}
  cancel-in-progress: false
jobs:
  # A push to the notes branch: find the note folders that changed and start the writer on main with them.
  handoff:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start the writer on main
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE=$(git rev-parse HEAD~1); fi
          dirs=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- inbox/ | grep -v '^inbox/README.md$' | awk -F/ 'NF>2{print $1"/"$2}' | sort -u | tr '\n' ' ')
          [ -z "${dirs// }" ] && { echo "No note folders changed."; exit 0; }
          echo "Folders: $dirs"
          gh workflow run writer.yml --ref main -R "$GITHUB_REPOSITORY" -f folder="$dirs"

  # Marks the writer as working (yellow) on the How it works page while this run goes. Trusted scripts from main only.
  working:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Show the agent as working
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: run
        run: "[ -f scripts/record-status.mjs ] && node scripts/record-status.mjs writer || true"

  write:
    needs: working
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bring in the notes
        id: notes
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          git fetch -q origin notes 2>/dev/null || echo "No notes branch; using inbox/ on main."
          dirs=
          for d in $FOLDER; do
            d="${d%/}"
            if git rev-parse -q --verify origin/notes >/dev/null && git ls-tree -d origin/notes -- "$d" | grep -q .; then git checkout origin/notes -- "$d"; fi
            [ -d "$d" ] && dirs="$dirs$d"$'\n' || echo "::warning::$d not found"
          done
          dirs=$(printf '%s' "$dirs" | sed '/^$/d')
          [ -z "$dirs" ] && { echo "No note folders found."; echo "dirs=" >> "$GITHUB_OUTPUT"; exit 0; }
          git reset -q -- inbox
          echo "Folders: $dirs"
          { echo "dirs<<EOF"; echo "$dirs"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$dirs" | head -1 | cut -d/ -f2 | tr -cd 'a-z0-9-' | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - name: Install Claude Code
        if: steps.notes.outputs.dirs != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Write the lesson with Claude
        if: steps.notes.outputs.dirs != ''
        env:
          # Prefer TX's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`); the API key is only a fallback.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIRS: ${{ steps.notes.outputs.dirs }}
        run: |
          set -o pipefail
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; echo "Auth: Claude subscription"; else unset CLAUDE_CODE_OAUTH_TOKEN; echo "Auth: API key (no CLAUDE_CODE_OAUTH_TOKEN secret)"; fi
          # What past reviews keep finding (the authoring memory on the agent-status branch); empty until there is some.
          curl -fsS -o /tmp/memory.json "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/agent-status/memory/authoring.json" || echo "{}" > /tmp/memory.json
          cat > /tmp/writer-prompt.md <<'PROMPT'
          You are the content creator for TX Learns, a bilingual (EN/中文) interactive learning site about AI.
          Your reader is a smart newcomer to AI. Your job: turn TX's raw notes into one lesson they enjoy and can
          follow without the source, in TX's own voice.
          TX has dropped raw notes in these inbox folders:
          __DIRS__

          Turn each folder into ONE new lesson. Work only on files; do not run git.
          Track: a folder may hold a one-line file named TRACK with the id of the learning track it belongs to
          (a top-level folder listed in tracks.js, e.g. ai-engineer). No TRACK file means agentic-ai. Below,
          <track> is that folder. If <track>/STORY.md exists it names this track's setting and characters: use them.

          1. Read CLAUDE.md and STYLE.md. Follow STYLE.md exactly; it is the whole point.
          2. Read every file in the folder (notes, code, images). TX's own confusions and "aha" moments are
             the human touch: keep them, especially for the "What I got wrong" callout.
          3. Study agentic-ai/07-agents-sdk-basics.html (and the last lessons already in <track>/) and assets/teach.js as the model for structure and widgets
             (.story, .teach, .codebox with .dim/.chg, TX2.predict, TX2.game, .cl checklist, .card takeaways).
             Reuse those widgets; do not invent new CSS unless needed.
          3c. /tmp/memory.json is the authoring memory: how often each kind of mistake was found in earlier reviews (with the
             latest example), and decisions to keep. It may be empty. Read it before you write and avoid those mistakes.
          4. Read <track>/lessons.js. If a planned item (no file) matches the concept, use it; otherwise add a new
             item under the best-fitting topic. Name the file <track>/NN-slug.html with the next free NN in that track,
             and add file:'NN-slug.html'. Tag: a project item (k:'p') gets "<Topic> · Project"; any other item gets
             "<Topic> · Lesson N", where N counts only the non-project items of that topic up to and including it.
             Check the tags of the topic's existing lessons and follow them. If the notes name a tag, use it.
             Order is easiest first: every topic in lessons.js has level:1 (beginner), 2 (intermediate) or 3 (advanced), and
             levels never go down the list. A new topic goes where its difficulty fits (before any harder topic), with its
             level set; a lesson goes in the position that suits a reader who has only done the lessons above it. The notes may
             name a level in a LEVEL file. The file number NN is only the next free one and need not match the order.
             Never type a topic or lesson count into any page or tracks.js: every count is computed from lessons.js.
          5. Source-neutral: invent your own story, character names and examples. Never copy names, prompts,
             project names or numbering from the notes if they look like they came from a paid source.
             Code may use real library APIs, but rewrite comments, variable names and prompts.
          6. Every .en block needs a matching, natural .zh block.
          7. Run `node scripts/check-copy.mjs`, `node scripts/check-counts.mjs` and `node scripts/check-pages.mjs` and fix everything they report until all pass.
             Then run `node scripts/check-pages.mjs --fix`: it updates sitemap.xml, the lesson list and the lesson's updated date.
             Start from agentic-ai/_template.html (copy it into <track>/): fill in its <title> and its description and og: tags with the lesson's own title and hero line.
          8. Before you finish, read your lesson once as that newcomer: every term is explained before it is used, every
             quiz answer was taught, no step's code uses something a later step creates, and each code box is complete
             enough to run (imports included, no placeholder that breaks the syntax).
          9. Write .writer-summary.md (repo root): the lesson title, file name, topic, a 3-line summary of the story,
             and anything in the notes you were unsure about or left out (as questions for TX).
          PROMPT
          python3 -c "import os,sys;p='/tmp/writer-prompt.md';s=open(p).read().replace('__DIRS__',os.environ['DIRS']);open(p,'w').write(s)"
          claude --model sonnet --exclude-dynamic-system-prompt-sections -p "$(cat /tmp/writer-prompt.md)" --max-turns 80 \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/check-copy.mjs:*),Bash(node scripts/check-counts.mjs:*),Bash(node scripts/check-pages.mjs:*),Bash(ls:*)" \
            --output-format text | tail -40
          # Drop scratch files the writer made outside the site (e.g. a .gen/ page generator), so they never deploy.
          keep=$(node -e "global.window={};require('./tracks.js');console.log(window.TRACKS.map(t=>t.id).join('|'))")
          git -c core.quotePath=false ls-files --others --exclude-standard | { grep -v -E "^(${keep}|assets)/|^\.writer-summary\.md$|^inbox/" || true; } | while read -r f; do echo "Removing scratch file $f"; rm -f -- "$f"; done
      - name: Copy check
        if: steps.notes.outputs.dirs != ''
        run: node scripts/check-copy.mjs | tee /tmp/copy-check.txt; exit ${PIPESTATUS[0]}
      # Writer PRs are opened with GITHUB_TOKEN, so the Copy check workflow does not run on them: check here.
      - name: Count check
        if: steps.notes.outputs.dirs != ''
        run: node scripts/check-counts.mjs && { [ ! -f scripts/check-pages.mjs ] || node scripts/check-pages.mjs; }
      - name: Open a pull request into main
        id: pr
        if: steps.notes.outputs.dirs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.notes.outputs.slug }}
          DIRS: ${{ steps.notes.outputs.dirs }}
        run: |
          if [ -z "$(git status --porcelain -- . ':!inbox' ':!.writer-summary.md')" ]; then echo "The writer changed nothing."; exit 1; fi
          branch="writer/${SLUG:-notes}-${GITHUB_RUN_NUMBER}"
          git config user.name "TX Learns content creator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A -- . ':!inbox' ':!.writer-summary.md'
          git commit -m "Draft lesson from ${DIRS//$'\n'/, }" -m "Written by the content creator agent (Claude) from TX's notes."
          git push -u origin "$branch"
          { echo "Draft lesson from \`${DIRS//$'\n'/\`, \`}\`, written by the content creator agent to STYLE.md."; echo;
            cat .writer-summary.md 2>/dev/null; echo; echo "Copy check: $(tail -1 /tmp/copy-check.txt)"; echo;
            echo "Next, by themselves: the intern agent reads the preview as a newcomer and adds clearer wording here if the lesson scores under 8/10,";
            echo "the frontend engineer agent clicks through it, then the backend engineer agent reviews the facts and code and adds its fixes here too.";
            echo "When all of them are green it merges by itself and the product engineer agent checks the live site. You only hear about it if it gets stuck."; } > /tmp/pr-body.md
          url=$(gh pr create --base main --head "$branch" --title "Draft lesson: ${SLUG:-new notes}" --body-file /tmp/pr-body.md)
          gh pr edit "$url" --add-assignee "${{ github.repository_owner }}" || true
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # A push with the workflow token starts no workflows, so start the required copy check on this branch.
          gh workflow run copy-check.yml --ref "$branch" -R "$GITHUB_REPOSITORY" || echo "::warning::Could not start the copy check."
      # Quiet on success: the reviewer agent messages TX once the lesson is read, reviewed and ready to approve.
      - name: Tell TX on Telegram
        if: failure() && steps.notes.outputs.dirs != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ steps.pr.outputs.url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/notify-telegram.mjs "⚠️ The content creator agent could not finish a draft from your notes.${URL:+ Draft: $URL} Logs: $RUN"
      - name: Record status for the Ecosystem page
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRS: ${{ steps.notes.outputs.dirs }}
          URL: ${{ steps.pr.outputs.url }}
          SLUG: ${{ steps.notes.outputs.slug }}
        run: |
          # No notes to draft: just clear this run's working mark.
          [ -z "$DIRS" ] && { STATE=idle node scripts/record-status.mjs writer; exit 0; }
          if [ -n "$URL" ]; then STATE=ok; SUMMARY="Drafted a lesson from the $SLUG notes. The intern, frontend and backend engineer agents look at it next."
          else STATE=fail; SUMMARY="Could not finish a draft from the $SLUG notes."; fi
          STATE=$STATE SUMMARY="$SUMMARY" LINK="$URL" node scripts/record-status.mjs writer
