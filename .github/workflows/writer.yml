# Content creator agent (the writer): when raw notes land in inbox/<concept>/ on the notes branch, Claude writes a lesson draft to
# STYLE.md and opens a pull request into main. It never pushes to main itself.
# The notes branch is data only (never deployed, never merged). A push there only hands the folders over to this
# workflow as it is on main (workflow_dispatch on main), so the writer always runs main's trusted version.
# That pull request is the only one for the lesson: the reader and reviewer agents add their fixes to it as
# commits, and the reviewer agent tells TX on Telegram when it is ready to approve. TX merges once.
name: Content creator (writer)
on:
  push:
    branches: [notes]
    paths:
      - 'inbox/**'
      - '!inbox/README.md'
  workflow_dispatch:
    inputs:
      folder:
        description: Inbox folders on the notes branch to write up, space separated, e.g. inbox/agents-as-tools
        required: true
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: writer-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # A push to the notes branch: find the note folders that changed and start the writer on main with them.
  handoff:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start the writer on main
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE=$(git rev-parse HEAD~1); fi
          dirs=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- inbox/ | grep -v '^inbox/README.md$' | awk -F/ 'NF>2{print $1"/"$2}' | sort -u | tr '\n' ' ')
          [ -z "${dirs// }" ] && { echo "No note folders changed."; exit 0; }
          echo "Folders: $dirs"
          # One run for the whole push: its folders are written in parallel and land in ONE pull request (no clashes between lessons).
          gh workflow run writer.yml --ref main -R "$GITHUB_REPOSITORY" -f folder="${dirs% }"

  # Marks the writer as working (yellow) on the How it works page while this run goes. Trusted scripts from main only.
  working:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Show the agent as working
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: run
        run: "[ -f scripts/record-status.mjs ] && node scripts/record-status.mjs writer || true"

  # Splits the folders into one parallel write job each.
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          json=$(node -e "const f=(process.env.FOLDER||'').split(/\\s+/).filter(Boolean).map(d=>d.replace(/\\/+\$/,''));console.log(JSON.stringify({folder:f}))")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"; echo "$json"

  # One job per folder, in parallel. Each writes its lesson and packs only its own change (scripts/writer-batch.mjs);
  # the publish job below applies all packs to main and opens ONE pull request.
  write:
    needs: [working, plan]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.plan.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bring in the notes
        id: notes
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          git fetch -q origin notes 2>/dev/null || echo "No notes branch; using inbox/ on main."
          dirs=
          for d in $FOLDER; do
            d="${d%/}"
            if git rev-parse -q --verify origin/notes >/dev/null && git ls-tree -d origin/notes -- "$d" | grep -q .; then git checkout origin/notes -- "$d"; fi
            [ -d "$d" ] && dirs="$dirs$d"$'\n' || echo "::warning::$d not found"
          done
          dirs=$(printf '%s' "$dirs" | sed '/^$/d')
          [ -z "$dirs" ] && { echo "No note folders found."; echo "dirs=" >> "$GITHUB_OUTPUT"; exit 0; }
          git reset -q -- inbox
          echo "Folders: $dirs"
          { echo "dirs<<EOF"; echo "$dirs"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$dirs" | head -1 | cut -d/ -f2 | tr -cd 'a-z0-9-' | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - name: Install Claude Code
        if: steps.notes.outputs.dirs != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Write the lesson with Claude
        if: steps.notes.outputs.dirs != ''
        env:
          # Prefer TX's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`); the API key is only a fallback.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIRS: ${{ steps.notes.outputs.dirs }}
        run: |
          set -o pipefail
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset ANTHROPIC_API_KEY; echo "Auth: Claude subscription"; else unset CLAUDE_CODE_OAUTH_TOKEN; echo "Auth: API key (no CLAUDE_CODE_OAUTH_TOKEN secret)"; fi
          # What past reviews keep finding (the authoring memory on the agent-status branch); empty until there is some.
          curl -fsS -o /tmp/memory.json "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/agent-status/memory/authoring.json" || echo "{}" > /tmp/memory.json
          cat > /tmp/writer-prompt.md <<'PROMPT'
          You are the content creator for TX Learns, a bilingual (EN/中文) interactive learning site about AI.
          Your reader is a smart newcomer to AI. Your job: turn TX's raw notes into one lesson they enjoy and can
          follow without the source, in TX's own voice.
          TX has dropped raw notes in these inbox folders:
          __DIRS__

          Turn each folder into ONE new lesson. Work only on files; do not run git.
          Track: a folder may hold a one-line file named TRACK with the id of the learning track it belongs to
          (a top-level folder listed in tracks.js, e.g. ai-engineer). No TRACK file means agentic-ai. Below,
          <track> is that folder. A story is optional (1 to 3 sentences, Singapore-set, only if it makes the idea click faster); <track>/STORY.md, if present, is just names you may reuse.

          1. Follow the rule packet at the end of this prompt: it is STYLE.md and CLAUDE.md boiled down to what you need. The full
             documents are reference only; open a section of STYLE.md only for a real question the packet cannot answer.
          2. Read every file in the folder (notes, code, images). TX's own confusions and "aha" moments are
             the human touch: keep them, especially for the "What I got wrong" callout.
          3. Study agentic-ai/07-agents-sdk-basics.html (and the last lessons already in <track>/) and assets/teach.js as the model for structure and widgets
             (.story, .teach, .codebox with .dim/.chg, TX2.predict, TX2.game, .cl checklist, .card takeaways).
             Reuse those widgets; do not invent new CSS unless needed.
          3c. /tmp/memory.json is the authoring memory: how often each kind of mistake was found in earlier reviews (with the
             latest example), and decisions to keep. It may be empty. Read it before you write and avoid those mistakes.
          3b. The brief at the end of this prompt has the closest passages the site already has on these notes (already searched,
             so do not run rag.mjs). Reuse their terms and characters, point to them in one short sentence ("we built this in ..."),
             and do not re-teach what they already teach.
          4. Read <track>/lessons.js. If a planned item (no file) matches the concept, use it; otherwise add a new
             item under the best-fitting topic. Name the file <track>/NN-slug.html with the next free NN in that track,
             and add file:'NN-slug.html'. Tag: a project item (k:'p') gets "<Topic> · Project"; any other item gets
             "<Topic> · Lesson N", where N counts only the non-project items of that topic up to and including it.
             Check the tags of the topic's existing lessons and follow them. If the notes name a tag, use it.
             Order is easiest first: every topic in lessons.js has level:1 (beginner), 2 (intermediate) or 3 (advanced), and
             levels never go down the list. A new topic goes where its difficulty fits (before any harder topic), with its
             level set; a lesson goes in the position that suits a reader who has only done the lessons above it. The notes may
             name a level in a LEVEL file. The file number NN is only the next free one and need not match the order.
             Never type a topic or lesson count into any page or tracks.js: every count is computed from lessons.js.
          5. Source-neutral: invent your own story, character names and examples. Never copy names, prompts,
             project names or numbering from the notes if they look like they came from a paid source.
             Code may use real library APIs, but rewrite comments, variable names and prompts.
          6. Every .en block needs a matching, natural .zh block.
          7. Run `node scripts/check-copy.mjs`, `node scripts/check-counts.mjs` and `node scripts/check-pages.mjs` and fix everything they report until all pass.
             Then run `node scripts/check-pages.mjs --fix`: it updates sitemap.xml, the lesson list and the lesson's updated date.
             Then run `node scripts/search-index.mjs`: it updates the related-lessons file (assets/related.json).
             Start from agentic-ai/_template.html (copy it into <track>/): fill in its <title> and its description and og: tags with the lesson's own title and hero line.
          8. Before you finish, read your lesson once as that newcomer: every term is explained before it is used, every
             quiz answer was taught, no step's code uses something a later step creates, and each code box is complete
             enough to run (imports included, no placeholder that breaks the syntax).
          9. Write .writer-summary.md (repo root): the lesson title, file name, topic, a 3-line summary of the story,
             and anything in the notes you were unsure about or left out (as questions for TX).
          PROMPT
          python3 -c "import os,sys;p='/tmp/writer-prompt.md';s=open(p).read().replace('__DIRS__',os.environ['DIRS']);open(p,'w').write(s)"
          # Deterministic prep before Claude: the 2 KB rule packet and the top passages the site already has on these notes.
          if [ -s scripts/rules/writer.md ] && [ -f scripts/agent-context.mjs ] && node scripts/agent-context.mjs writer --dirs "$(echo $DIRS)" --out /tmp/writer-brief.md; then
            { echo; echo "=== RULE PACKET ==="; cat scripts/rules/writer.md; echo; echo "=== BRIEF ==="; cat /tmp/writer-brief.md; } >> /tmp/writer-prompt.md
          else
            echo "No rule packet yet: falling back to the full documents."
            echo "Read CLAUDE.md and STYLE.md first and follow STYLE.md exactly. Link back to lessons the site already has on the concept." >> /tmp/writer-prompt.md
          fi
          curl -fsS -o /tmp/runs.json "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/agent-status/trace/runs.json" || true
          TURNS=80; [ -f scripts/max-turns.mjs ] && TURNS=$(node scripts/max-turns.mjs writer 80 --floor 30 || echo 80)
          curl -fsS -o /tmp/claude-run.mjs "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/claude-run.mjs" && CC="node /tmp/claude-run.mjs writer" || CC=claude
          $CC --model sonnet --exclude-dynamic-system-prompt-sections -p "$(cat /tmp/writer-prompt.md)" --max-turns "$TURNS" \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/check-copy.mjs:*),Bash(node scripts/check-counts.mjs:*),Bash(node scripts/check-pages.mjs:*),Bash(node scripts/search-index.mjs:*),Bash(ls:*)" \
            --output-format text | tail -40
          # Drop scratch files the writer made outside the site (e.g. a .gen/ page generator), so they never deploy.
          keep=$(node -e "global.window={};require('./tracks.js');console.log(window.TRACKS.map(t=>t.id).join('|'))")
          git -c core.quotePath=false ls-files --others --exclude-standard | { grep -v -E "^(${keep}|assets)/|^\.writer-summary\.md$|^inbox/" || true; } | while read -r f; do echo "Removing scratch file $f"; rm -f -- "$f"; done
      - name: Copy check
        if: steps.notes.outputs.dirs != ''
        run: node scripts/check-copy.mjs | tee /tmp/copy-check.txt; exit ${PIPESTATUS[0]}
      # Writer PRs are opened with GITHUB_TOKEN, so the Copy check workflow does not run on them: check here.
      - name: Count check
        if: steps.notes.outputs.dirs != ''
        run: node scripts/check-counts.mjs && { [ ! -f scripts/check-pages.mjs ] || node scripts/check-pages.mjs; }
      - name: Pack this lesson's change
        if: steps.notes.outputs.dirs != ''
        run: node scripts/writer-batch.mjs pack /tmp/pack
      - name: Keep the pack for the publish job
        if: steps.notes.outputs.dirs != ''
        uses: actions/upload-artifact@v4
        with:
          name: pack-${{ strategy.job-index }}
          path: /tmp/pack
          if-no-files-found: error
          retention-days: 3
      - name: Record what the agent used (tokens and estimated cost)
        if: ${{ !cancelled() && steps.notes.outputs.dirs != '' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "[ -f scripts/trace.mjs ] && node scripts/trace.mjs push writer /tmp/out || true"

  # Applies every pack to main, rebuilds the generated files once and opens ONE pull request for the whole batch.
  publish:
    needs: [plan, write]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          path: /tmp/packs
      - name: Apply the packs and rebuild the generated files
        id: apply
        env:
          FOLDERS: ${{ inputs.folder }}
        run: |
          packs=$(ls -d /tmp/packs/pack-* 2>/dev/null | sort -V | tr '\n' ' ')
          if [ -z "$packs" ]; then echo "No lesson was written."; echo "packed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/writer-batch.mjs apply $packs
          node scripts/check-pages.mjs --fix
          [ -f scripts/search-index.mjs ] && node scripts/search-index.mjs
          echo "packed=$(echo $packs | wc -w)" >> "$GITHUB_OUTPUT"
          first=$(echo $FOLDERS | awk '{print $1}' | cut -d/ -f2 | tr -cd 'a-z0-9-' | cut -c1-40)
          n=$(echo $FOLDERS | wc -w)
          [ "$n" -gt 1 ] && first="$first-and-$((n-1))-more"
          echo "slug=$first" >> "$GITHUB_OUTPUT"
      - name: Copy check
        if: steps.apply.outputs.packed != '0'
        run: node scripts/check-copy.mjs | tee /tmp/copy-check.txt; exit ${PIPESTATUS[0]}
      - name: Count and page check
        if: steps.apply.outputs.packed != '0'
        run: node scripts/check-counts.mjs && { [ ! -f scripts/check-pages.mjs ] || node scripts/check-pages.mjs; }
      - name: Open ONE pull request into main
        id: pr
        if: steps.apply.outputs.packed != '0'
        env:
          # MERGE_TOKEN (TX's token) opens the pull request, so the checks start without waiting for someone to approve a bot's workflow run.
          GH_TOKEN: ${{ secrets.MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_MERGE_TOKEN: ${{ secrets.MERGE_TOKEN != '' }}
          SLUG: ${{ steps.apply.outputs.slug }}
          FOLDERS: ${{ inputs.folder }}
          PACKED: ${{ steps.apply.outputs.packed }}
        run: |
          branch="writer/${SLUG:-notes}-${GITHUB_RUN_NUMBER}"
          git config user.name "TX Learns content creator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Draft lessons from ${FOLDERS// /, }" -m "Written by the content creator agent (Claude) from TX's notes, in one pull request."
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=" -c "http.https://github.com/.extraheader=$auth" push -u origin "$branch"
          { echo "Draft lessons from \`${FOLDERS// /\`, \`}\`, written by the content creator agent to STYLE.md, all in this one pull request ($PACKED written)."; echo;
            for f in /tmp/packs/pack-*/summary.md; do [ -f "$f" ] && { cat "$f"; echo; }; done
            echo "Copy check: $(tail -1 /tmp/copy-check.txt)"; echo;
            echo "Next, by themselves: the intern agent reads the preview as a newcomer and adds clearer wording here if a lesson scores under 8/10,";
            echo "the frontend engineer agent clicks through it, then the backend engineer agent reviews the facts and code and adds its fixes here too.";
            echo "When all of them are green it merges by itself and the product engineer agent checks the live site. You only hear about it if it gets stuck."; } > /tmp/pr-body.md
          title="Draft lesson: ${SLUG:-new notes}"; [ "$PACKED" -gt 1 ] && title="Draft lessons: $PACKED lessons from ${SLUG}"
          url=$(gh pr create --base main --head "$branch" --title "$title" --body-file /tmp/pr-body.md)
          gh pr edit "$url" --add-assignee "${{ github.repository_owner }}" || true
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # With MERGE_TOKEN the pull request starts its own checks; without it, start the required copy check by hand.
          [ "$HAS_MERGE_TOKEN" = true ] || gh workflow run copy-check.yml --ref "$branch" -R "$GITHUB_REPOSITORY" || echo "::warning::Could not start the copy check."
      # Quiet on success: the reviewer agent messages TX once the lessons are read, reviewed and ready to approve.
      - name: Tell TX on Telegram
        if: ${{ failure() || needs.write.result == 'failure' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ steps.pr.outputs.url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/notify-telegram.mjs "⚠️ The content creator agent could not finish every draft from your notes.${URL:+ Pull request with the ones that worked: $URL} Logs: $RUN"
      - name: Record status for the Ecosystem page
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.pr.outputs.url }}
          SLUG: ${{ steps.apply.outputs.slug }}
          PACKED: ${{ steps.apply.outputs.packed }}
        run: |
          [ -f scripts/record-status.mjs ] || exit 0
          if [ -n "$URL" ]; then STATE=ok; SUMMARY="Drafted $PACKED lesson(s) from the $SLUG notes in one pull request. The intern, frontend and backend engineer agents look at it next."
          elif [ -z "$PACKED" ] || [ "$PACKED" = 0 ]; then STATE=fail; SUMMARY="Could not finish a draft from the $SLUG notes."
          else STATE=fail; SUMMARY="Could not open the pull request for the $SLUG notes."; fi
          STATE=$STATE SUMMARY="$SUMMARY" LINK="$URL" node scripts/record-status.mjs writer
