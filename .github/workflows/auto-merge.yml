# Auto-merge: TX no longer presses merge. scripts/auto-merge.mjs merges a pull request into main by itself once
# copy-check and Reviewer (the required checks in .github/rulesets/main.json) are green on its newest commit. It
# merges every ready pull request in one run, never waiting for the UI check or an earlier live check, and then
# starts one live check (product engineer agent) on the whole batch, which rolls it back if it broke the live site. A stuck pull request (a red check the agents could not fix, a merge conflict,
# a change to the auto-merge rules themselves, a workflow change while the secret MERGE_TOKEN is missing, or a
# check silent for 3 hours) gets one PR comment and one Telegram message.
# Started once copy-check and Reviewer are BOTH green on the same commit (by whichever finishes second; the UI check no longer
# starts it) and after each live check; every 30 minutes as a safety net for a red check, a race or a failed start.
# A run that is merging is never cancelled (concurrency: cancel-in-progress false); a newer start waits its turn. MERGE_TOKEN (fine-grained token: Contents, Pull requests, Workflows read/write on this repo) lets it merge PRs that change workflows. No AI, trusted scripts from main only. The label "hold" keeps a PR open.
name: Auto-merge
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      done_run:
        description: A live check run that has finished its work (it starts auto-merge from its last step), so it does not count as busy
        required: false
permissions:
  contents: read
concurrency:
  group: auto-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: read
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          sparse-checkout: |
            scripts
            banned-words.txt
            .github/rulesets
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Merge what is ready, flag what is stuck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ secrets.MERGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DONE_RUN: ${{ inputs.done_run }}
        run: node scripts/auto-merge.mjs
