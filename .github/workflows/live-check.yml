# Live check agent: right after the release agent puts a release live (it is a step of that run), a script waits
# for Vercel to finish the production deploy, then opens every page, lesson, link and file on the live site, renders each page in a headless browser and checks the topic and lesson counts against lessons.js.
# It tells TX on Telegram only when something is off; a pass shows on the How it works page and in the digest.
# No AI, read-only token, never pushes. Only trusted scripts from main run.
name: Live check
on:
  # Started by release.yml after each real release, not by Vercel's deployment events (one deploy sends several,
  # and each one cancelled the last) and not on a timer. No release, no live check.
  workflow_call:
    inputs:
      sha:
        description: The merge commit the release agent just put on main
        required: true
        type: string
  workflow_dispatch:
    inputs:
      url:
        description: Site to check (empty = the live site)
        required: false
permissions:
  contents: read
  deployments: read
concurrency:
  # A second run waits for the first instead of cancelling it.
  group: live-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      state: ${{ steps.run.outputs.state }}
      summary: ${{ steps.run.outputs.summary }}
    env:
      # The production domain, not the per-deploy URL (that one may sit behind Vercel's login).
      SITE: ${{ inputs.url || vars.LIVE_URL || 'https://tx-learns.vercel.app/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The released commit (or main on a manual run): its lessons.js is the list the live site must match.
          ref: ${{ inputs.sha || github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Vercel to finish the production deploy
        if: ${{ inputs.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          # Up to 15 minutes. If Vercel never reports, the check still runs and compares the live lesson list.
          for i in $(seq 1 30); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&environment=Production" --jq '.[0].id // empty' || true)
            if [ -n "$id" ]; then
              st=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state // empty' || true)
              echo "Vercel deploy $id: ${st:-no status yet}"
              case "$st" in success) exit 0;; failure|error) echo "::warning::Vercel says the deploy $st"; exit 0;; esac
            else echo "No production deploy for $SHA yet"; fi
            sleep 30
          done
          echo "::warning::Vercel did not report a finished deploy within 15 minutes; checking anyway"
      - name: Install a headless browser
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check the live site
        id: run
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
        run: |
          set +e; node scripts/live-check.mjs --base "$SITE" --wait 300 --out /tmp/live-check.json; code=$?; set -e
          node -e 'const r=require("/tmp/live-check.json");console.log("summary="+r.summary.replace(/\n/g," "))' >> "$GITHUB_OUTPUT" || echo "summary=The live check could not finish." >> "$GITHUB_OUTPUT"
          if [ "$code" = 0 ]; then echo "state=ok" >> "$GITHUB_OUTPUT"; elif [ "$code" = 1 ]; then echo "state=flag" >> "$GITHUB_OUTPUT"; else echo "state=fail" >> "$GITHUB_OUTPUT"; fi
          [ "$code" -le 1 ]
      - name: Tell TX on Telegram
        # Not on a cancelled run: someone stopped it, which is not a problem with the site.
        if: ${{ !cancelled() && steps.run.outputs.state != 'ok' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -s /tmp/live-check.json ]; then
            { echo "🌐 Live site check: something is off"; echo "$SITE"; echo;
              node -e 'const r=require("/tmp/live-check.json");console.log(r.issues.slice(0,10).map(i=>"• "+i.page+": "+i.what).join("\n"))';
              echo; echo "Details: $RUN"; } | node scripts/notify-telegram.mjs
          else
            node scripts/notify-telegram.mjs "⚠️ The live check agent could not finish. Logs: $RUN"
          fi
  # Separate job: the write token for the status log never shares a job with the checked-out release.
  record:
    needs: check
    # A cancelled run records nothing, so it never shows as a failure on the How it works page.
    if: ${{ !cancelled() && needs.check.result != 'skipped' && needs.check.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          sparse-checkout: |
            scripts
            banned-words.txt
          persist-credentials: false
      - name: Record status for the Ecosystem page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ needs.check.outputs.state || 'fail' }}
          SUMMARY: ${{ needs.check.outputs.summary || 'The live check could not finish.' }}
        run: node scripts/record-status.mjs live-check
